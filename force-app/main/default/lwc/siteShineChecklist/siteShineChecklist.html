<template>
    <article class="container slds-card">
        <header class="header slds-card__header slds-grid slds-grid_align-spread">
            <div>
                <h2 class="slds-text-heading_small">{title}</h2>
                <template if:true={hasDownload}>
                    <a
                        class="download-link"
                        href={downloadUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Download Checklist PDF
                    </a>
                </template>
                <template if:false={hasDownload}>
                    <span class="placeholder">
                        {error}
                    </span>
                </template>
            </div>
        </header>

        <div class="body slds-card__body">
            <div class="list-wrapper">
                <ul class="checklist">
                    <template for:each={checklistItems} for:item="item">
                        <li key={item.id} class={item.className}>{item.label}</li>
                    </template>
                </ul>
            </div>
        </div>
    </article>
</template>
